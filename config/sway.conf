# sway-alttab: add to ~/.config/sway/config (or `include` this file)
exec_always pkill -f '^python3 .*workspace-history'; exec ~/.local/bin/workspace-history
bindsym Mod1+Tab       exec pkill -USR1 -f "^python3 .*workspace-history"
bindsym Mod1+Shift+Tab exec pkill -USR2 -f "^python3 .*workspace-history"

# Optional: app icons in workspace names (shown in the Alt+Tab strip and the bar)
# exec_always pkill -f '^python3 .*workspace-icons'; exec ~/.local/bin/workspace-icons
