# sway-alttab: add to ~/.config/i3/config (no on-screen strip on i3, the rest works)
exec_always --no-startup-id pkill -f '^python3 .*workspace-history'; exec ~/.local/bin/workspace-history
bindsym Mod1+Tab       exec --no-startup-id pkill -USR1 -f "^python3 .*workspace-history"
bindsym Mod1+Shift+Tab exec --no-startup-id pkill -USR2 -f "^python3 .*workspace-history"

# Optional: app icons in workspace names
# exec_always --no-startup-id pkill -f '^python3 .*workspace-icons'; exec ~/.local/bin/workspace-icons
